name: publish

on:
  push:
    branches:
      - main
      - draft/*

  pull_request:
    branches:
      - main

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          clean: 'false'
          fetch-depth: '0'
      - name: install net 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'
      - name: Nuke
        run: ./build.cmd GitHubActions
        env:
            NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
            NETLIFY_URL: ${{ secrets.NETLIFY_URL }}
